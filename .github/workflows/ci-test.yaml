name: ci-test

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  run-test-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest

    build:
      needs: [run-test-code]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.13"
        - run: pip install -r requirements.txt
        - name: Image build
          run: docker build -t jiwooooo0/flaskweb .
        - name: Image Display
          run: docker images
